<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183b3a">
  <title>iPhoneで全画面にする方法｜たるとのゲームひろば</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:max(22px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:grid;place-items:center;background:radial-gradient(circle at 85% 10%,#ffc34c 0 8%,transparent 9%),linear-gradient(145deg,#5fcea9,#183b3a);color:#183b3a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.card{width:min(620px,94vw);padding:26px;border:3px solid #fff8e9;border-radius:28px;background:#fff8e9f5;box-shadow:0 18px 50px #10272677}.eyebrow{margin:0;color:#e45d55;font-size:10px;font-weight:900;letter-spacing:.16em}.card h1{margin:4px 0 6px;color:#183b3a;font-size:clamp(26px,6vw,42px);line-height:1.2}.lead{margin:0 0 17px;color:#6f604d;font-size:13px;font-weight:800}.steps{margin:0;padding:0;list-style:none;counter-reset:step;display:grid;gap:9px}.steps li{counter-increment:step;display:grid;grid-template-columns:38px 1fr;align-items:center;gap:10px;padding:10px 13px;border:1px solid #e9bf83;border-radius:15px;background:#fff}.steps li::before{content:counter(step);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e45d55;color:#fff;font-size:17px;font-weight:900}.steps b{font-size:15px;line-height:1.5}.note{margin:14px 0 0;padding:8px 12px;border-radius:12px;background:#d9f1e8;color:#245f56;font-size:11px;font-weight:800}.back{display:inline-flex;margin-top:17px;padding:10px 17px;border-radius:99px;background:#183b3a;color:#fff8e9;text-decoration:none;font-size:13px;font-weight:900;box-shadow:0 5px 0 #0d2423}.back:active{transform:translateY(3px);box-shadow:0 2px 0 #0d2423}@media(max-height:470px) and (orientation:landscape){body{padding:8px 16px}.card{width:min(780px,95vw);padding:12px 18px;border-radius:19px}.card h1{display:inline;font-size:23px}.eyebrow{font-size:7px}.lead{display:inline;margin-left:8px;font-size:9px}.steps{grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.steps li{grid-template-columns:27px 1fr;gap:6px;padding:5px 8px}.steps li::before{width:25px;height:25px;font-size:12px}.steps b{font-size:9px}.note{margin:6px 0 0;padding:5px 8px;font-size:8px}.back{position:absolute;right:max(13px,env(safe-area-inset-right));bottom:max(9px,env(safe-area-inset-bottom));margin:0;padding:6px 11px;font-size:9px}}
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">IPHONE FULLSCREEN GUIDE</p>
    <h1>iPhoneで全画面にする方法</h1>
    <p class="lead">Safariの上下のバーを消して、ゲームを広く表示できます。</p>
    <ol class="steps">
      <li><b>iPhoneのSafariで「たるとのゲームひろば」を開く</b></li>
      <li><b>Safariの共有ボタンを押す</b></li>
      <li><b>「ホーム画面に追加」を選ぶ</b></li>
      <li><b>ホームに追加された「たるとのゲームひろば」のアイコンから起動</b></li>
      <li><b>端末を横向きにする</b></li>
    </ol>
    <p class="note">次回からはSafariではなく、ホーム画面の「たるとのゲームひろば」アイコンから起動してください。</p>
    <a class="back" href="index.html">← ゲームひろばへ戻る</a>
  </main>
</body>
</html>
